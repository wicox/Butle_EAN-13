name: CI — Kompilacja i Weryfikacja

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalacja zależności
        run: npm ci

      - name: Kontrola typów TypeScript
        run: npm run typecheck

      - name: Kompilacja aplikacji (Vite build)
        run: npm run build

      - name: Weryfikacja artefaktów kompilacji
        run: |
          test -f dist/index.html
          test -f server.ts
          test -f start.sh
